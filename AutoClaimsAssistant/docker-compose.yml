# docker-compose.yml
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: claims_assistant
      POSTGRES_USER: claims_assistant
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims_assistant"]
      interval: 5s
      timeout: 5s
      retries: 5

  policy-db-mcp:
    build: .
    command: uv run python -m claims_assistant.mcp_servers.policy_db
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "8101:8101"
    depends_on:
      postgres:
        condition: service_healthy

  claims-history-mcp:
    build: .
    command: uv run python -m claims_assistant.mcp_servers.claims_history
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "8102:8102"
    depends_on:
      postgres:
        condition: service_healthy

  vin-vehicle-mcp:
    build: .
    command: uv run python -m claims_assistant.mcp_servers.vin_vehicle
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "8103:8103"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POLICY_DB_MCP_URL: http://policy-db-mcp:8101/mcp
      CLAIMS_HISTORY_MCP_URL: http://claims-history-mcp:8102/mcp
      VIN_VEHICLE_MCP_URL: http://vin-vehicle-mcp:8103/mcp
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      policy-db-mcp:
        condition: service_started
      claims-history-mcp:
        condition: service_started
      vin-vehicle-mcp:
        condition: service_started

  frontend:
    build: .
    command: uv run streamlit run src/claims_assistant/frontend/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      CLAIMS_API_BASE_URL: http://api:8000
      FRONTEND_ACCESS_PASSWORD: devpassword
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_started


volumes:
  pgdata:
