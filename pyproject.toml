[project]
name = "claims-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "narasimhapeta", email = "simhamp@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core>=1.14.0",
    "agent-framework-openai>=1.13.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "mcp[cli]>=2.0.0",
    "pydantic-settings>=2",
    "sqlalchemy[asyncio]>=2",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
claims-assistant = "claims_assistant:main"

[build-system]
requires = ["uv_build>=0.9.30,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires external services (e.g. Postgres) to be running",
]
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

